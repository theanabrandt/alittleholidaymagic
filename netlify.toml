[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["stripe"]

# /dashboard and /privacy work on their own (Netlify serves dashboard.html and privacy.html).

[[redirects]]
  from = "/demo"
  to = "/santa"
  status = 200

# Every studio page: alittleholidaymagic.com/studio-name
[[redirects]]
  from = "/:slug"
  to = "/santa"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
